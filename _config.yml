# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: "Kimberly Herrera"

email: &EMAIL "herre484@umn.edu"
github_username: &GITHUB "Herrerak"

url: "https://herrerak.github.io"
baseurl: "/Personal-Website"

description: >
  Hey you found me! This is my personal website where you'll find my mathematical interests, projects, and many other things I do.

minimal_mistakes_skin: default
search: true

author:
  name   : "Kimberly Herrera"
  avatar : "assets/images/kim-photo.jpg"
  bio    : >
    Hi there! I'm a math PhD student at UMN Twin Cities.
    I'm interested in algebraic geometry, homological algebra, and Lie theory.
    
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: !join ["mailto:", *EMAIL]

    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: !join ["https://github.com/", *GITHUB]

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes

# Outputting
permalink: /:categories/:title/
paginate: 5
paginate_path: /page:num/
timezone: America/Chicago

include:
  - _pages

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

# Default layouts
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true

  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

# Archives
category_archive:
  type: liquid
  path: /categories/

tag_archive:
  type: liquid
  path: /tags/